name: skill-node-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: git identity for fixture repos
        run: |
          git config --global user.name "skill-ci"
          git config --global user.email "skill-ci@example.invalid"
          git config --global init.defaultBranch main
      - name: upstream tests (upstream config fixture)
        env:
          REVIEW_PR_RULES_FILE: ${{ github.workspace }}/tools/fixtures/upstream-pr-rules.json
        run: node --test "review-pr/scripts/*.test.mjs"
      - name: Mivo patch and glue tests (Mivo config)
        run: node --test review-pr/scripts/mivo-patches.test.mjs "tools/*.test.mjs" "mivo/**/*.test.mjs"
